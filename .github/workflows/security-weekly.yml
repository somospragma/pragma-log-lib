name: Weekly security scan

# New vulnerabilities appear in dependencies that did not change, so they are scanned every week:
# - The Gradle dependency graph is sent to GitHub: Dependabot alerts show up in the Security tab
#   (GitHub only raises them for the default branch).
# - OSV-Scanner checks what each published module ships and keeps one issue labeled "security" up to date:
#   opened or updated when something is found, closed when everything is clean.
# Scheduled workflows run from the default branch only; until v2 replaces main, SCAN_REF points at v2.
on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC (07:00 Bogotá)
  workflow_dispatch:
  push:
    paths: ['.github/workflows/security-weekly.yml']

permissions:
  contents: read

env:
  SCAN_REF: v2
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:6421cdd773a54fad5fd991895b4f3840beba55a2f30a8182185919e13979a2c8 # v2.3.0
  ISSUE_TITLE: Vulnerable dependencies (weekly scan)

jobs:
  dependency-graph:
    name: Dependency graph (Dependabot alerts)
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_REF }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only the published modules and what they ship, not tests, examples or build tools.
          dependency-graph-include-projects: '^:pragma-log-.*'
          dependency-graph-include-configurations: '^(compileClasspath|runtimeClasspath)$'

  osv:
    name: Dependency audit (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_REF }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew resolveShippedDependencies --write-locks --no-configuration-cache
      - name: Scan
        id: scan
        run: |
          args=()
          for lockfile in $(find . -name gradle.lockfile -not -path './build-logic/*'); do
            args+=(-L "$lockfile")
          done
          status=0
          docker run --rm -v "$PWD":/src -w /src "$OSV_SCANNER_IMAGE" scan source --format markdown "${args[@]}" > osv.md || status=$?
          cat osv.md
          # 0: nothing found, 1: vulnerabilities found, anything else: the scan itself failed.
          if (( status > 1 )); then exit "$status"; fi
          echo "found=$(( status == 1 ))" >> "$GITHUB_OUTPUT"
      - name: Report in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.scan.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create security --color B60205 --description "Security findings" --force
          issue=$(gh issue list --label security --state open --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [[ "$FOUND" == "1" ]]; then
            {
              echo "Weekly scan of \`$SCAN_REF\` found vulnerable dependencies ($RUN_URL)."
              echo
              echo "Update the dependency (or the BOM that brings it) and the issue closes on the next clean scan."
              echo
              cat osv.md
            } > body.md
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --body-file body.md
              gh issue comment "$issue" --body "Still vulnerable on $(date -u +%F): $RUN_URL"
            else
              gh issue create --title "$ISSUE_TITLE" --label security --body-file body.md
            fi
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Clean scan on $(date -u +%F): $RUN_URL"
          fi
