name: Quarkus native

# Builds the Quarkus example as a native executable and runs QuarkusLoggingIT against it (INT-04).
# Separate from CI because it takes about 10 minutes and only depends on core and the Quarkus modules.
on:
  push:
    branches: [main, v2]
    paths:
      - 'pragma-log-core/**'
      - 'pragma-log-quarkus*/**'
      - 'examples/quarkus/**'
      - 'gradle/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The native image is built inside the Mandrel builder container; the runner has Docker.
      - name: Build native executable and run native tests
        run: >
          ./gradlew :examples:quarkus:testNative
          -Dquarkus.native.enabled=true
          -Dquarkus.native.container-build=true
          -Dquarkus.package.jar.enabled=false

      # Output of the native executable started by the tests: startup errors are only there.
      - name: Show native app output
        if: failure()
        working-directory: examples/quarkus
        run: |
          find . -name '*.log' -not -path '*/test-results/*' -exec sh -c 'echo "== $1"; tail -200 "$1"' _ {} \;
          echo "== native executable started by hand"
          timeout 10 ./build/*-runner -Dquarkus.profile=it 2>&1 | tail -100 || true

      - name: Upload test reports and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports
          path: |
            examples/quarkus/build/reports/tests/
            examples/quarkus/build/test-logs/
            examples/quarkus/**/*.log
