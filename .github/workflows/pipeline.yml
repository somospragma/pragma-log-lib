name: Pipeline

# Quality (CI) → Security (CI) → Build → Approval + Publish (CD, only for v* tags).
# Actions and images are pinned by digest: a moved tag cannot inject code into the pipeline.
on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner@sha256:6421cdd773a54fad5fd991895b4f3840beba55a2f30a8182185919e13979a2c8 # v2.3.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1

jobs:
  # ---------------------------------------------------------------- Quality (CI)
  lint:
    name: Lint (Error Prone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Error Prone runs on JDK 21+; -Werror turns its warnings into failures.
      - run: ./gradlew compileJava compileTestJava

  typecheck:
    name: Compile (Java 17 baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew compileJava compileTestJava

  test:
    name: Test + coverage (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Unit and integration tests, Spring Boot 4 and 3.5, the examples and the minimum coverage per module.
      - run: ./gradlew test boot3Test jacocoTestCoverageVerification :examples:plain-java:run
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/

  dead-code:
    name: Dead code (PMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew pmdMain
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmd-report
          path: '**/build/reports/pmd/'

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame data for new-code detection
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Tests with JaCoCo coverage, then the analysis; fails when the quality gate fails.
      - run: ./gradlew test sonar --no-configuration-cache
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'somospragma_pragma-log-lib' }}

  native:
    name: Native tests (Quarkus)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The native executable is built inside the Mandrel builder container and QuarkusLoggingIT runs against it.
      - run: >
          ./gradlew :examples:quarkus:testNative
          -Dquarkus.native.enabled=true
          -Dquarkus.native.container-build=true
          -Dquarkus.package.jar.enabled=false
      - name: Show native app output
        if: failure()
        working-directory: examples/quarkus
        run: |
          find . -name '*.log' -not -path '*/test-results/*' -exec sh -c 'echo "== $1"; tail -200 "$1"' _ {} \;
          echo "== native executable started by hand"
          timeout 10 ./build/*-runner -Dquarkus.profile=it 2>&1 | tail -100 || true
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-reports
          path: |
            examples/quarkus/build/reports/tests/
            examples/quarkus/**/*.log

  # ---------------------------------------------------------------- Security (CI)
  dependency-audit:
    name: Dependency audit (OSV-Scanner)
    needs: [lint, typecheck, test, dead-code, sonar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Records what each published module ships (compile and runtime classpaths) in gradle.lockfile.
      - run: ./gradlew resolveShippedDependencies --write-locks --no-configuration-cache
      - name: Scan dependencies
        run: |
          args=()
          for lockfile in $(find . -name gradle.lockfile -not -path './build-logic/*'); do
            args+=(-L "$lockfile")
          done
          docker run --rm -v "$PWD":/src -w /src "$OSV_SCANNER_IMAGE" scan source "${args[@]}"

  secret-scan:
    name: Secret scan (gitleaks)
    needs: [lint, typecheck, test, dead-code, sonar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Whole history; .gitleaksignore lists reviewed fake values by fingerprint.
      - run: docker run --rm -v "$PWD":/repo "$GITLEAKS_IMAGE" git /repo --redact --verbose

  sast:
    name: SAST (SpotBugs + FindSecBugs)
    needs: [lint, typecheck, test, dead-code, sonar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew spotbugsMain
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-report
          path: '**/build/reports/spotbugs/'

  # ---------------------------------------------------------------- Build
  build:
    name: Build artifacts
    needs: [dependency-audit, secret-scan, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "args=-Pversion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      # Jars, sources, javadoc and POMs of every published module, in a local Maven layout.
      - run: ./gradlew publishToMavenLocal -Dmaven.repo.local="$PWD/build/m2" ${{ steps.version.outputs.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-artifacts
          path: build/m2/co/
          if-no-files-found: error

  # ---------------------------------------------------------------- Approval (CD)
  # Environment reviewers need a paid plan on private repositories, so the approval is an issue: an approver
  # listed in the RELEASE_APPROVERS variable (comma-separated logins) comments "approve" or "deny".
  approval:
    name: Release approval
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      issues: write
    steps:
      - uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.RELEASE_APPROVERS }}
          minimum-approvals: 1
          issue-title: Publish ${{ github.ref_name }} to Maven Central
          issue-body: >
            The pipeline of ${{ github.ref_name }} passed Quality, Security and Build
            (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Comment "approve" to publish it to Maven Central or "deny" to stop. Expires in 2 hours.
          close-issue-means-denial: true

  # ---------------------------------------------------------------- Publish (CD)
  publish:
    name: Publish to Maven Central
    needs: approval
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Holds the Sonatype and GPG secrets and only accepts v* tags.
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Check secrets and variables
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GROUP_ID: ${{ vars.MAVEN_GROUP_ID }}
          POM_LICENSE_NAME: ${{ vars.POM_LICENSE_NAME }}
          POM_LICENSE_URL: ${{ vars.POM_LICENSE_URL }}
        run: |
          missing=()
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_KEY_PASSWORD \
              MAVEN_GROUP_ID POM_LICENSE_NAME POM_LICENSE_URL; do
            value="${!name}"
            if [[ -z "$value" || "$value" == "REPLACE_ME" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets (organization) or variables (maven-central environment): ${missing[*]}"
            exit 1
          fi
      - run: >
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
          -Pversion="${GITHUB_REF_NAME#v}" -Pgroup="$MAVEN_GROUP_ID"
        env:
          MAVEN_GROUP_ID: ${{ vars.MAVEN_GROUP_ID }}
          ORG_GRADLE_PROJECT_pomLicenseName: ${{ vars.POM_LICENSE_NAME }}
          ORG_GRADLE_PROJECT_pomLicenseUrl: ${{ vars.POM_LICENSE_URL }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
