quarkus.application.name=customers-service

pragma.log.fields.env=local
pragma.log.http.headers=X-Client-Id
pragma.log.masking.patterns=CARD,JWT
pragma.log.alerts.max-log-size=64K
pragma.log.alerts.listeners=co.com.pragma.logging.examples.quarkus.LargeLogAlertLogger
# Readable masked text instead of JSON in dev mode:
# %dev.pragma.log.format=plain

# Tests read the JSON logs from a file.
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=build/test-logs/app.log
%test.pragma.log.http.headers=X-Client-Id,Authorization
%test.pragma.log.include-pid=true

# Native integration tests (./gradlew :examples:quarkus:testNative): the test profile, its own file and settings
# that use reflection in JVM mode.
quarkus.test.integration-test-profile=it
%it.quarkus.config.profile.parent=test
%it.quarkus.log.file.path=build/test-logs/native.log
%it.pragma.log.timestamp.pattern=[ISO_INSTANT]
%it.pragma.log.timestamp.zone=UTC
