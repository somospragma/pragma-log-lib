quarkus.application.name=customers-service

pragma.log.fields.env=local
pragma.log.http.headers=X-Client-Id
# pragma.log.format=plain   # uncomment for the regular Quarkus console output

# Tests read the JSON logs from a file.
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=build/test-logs/app.log
%test.pragma.log.http.headers=X-Client-Id,Authorization
%test.pragma.log.include-pid=true
